<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${title}の解説と活用ガイド - 補助金情報ナビ</title>
    <meta name="description" content="${meta_desc}">
    <meta property="og:title" content="${title}の解説と活用ガイド">
    <meta property="og:description" content="${meta_desc}">
    <meta property="og:type" content="article">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Article",
      "headline": "${title}",
      "description": "${meta_desc}",
      "publisher": {
        "@type": "Organization",
        "name": "IT補助金・助成金ナビ"
      }
    }
    </script>

    <style>
        :root {
            --primary: #1a365d;
            --secondary: #2b6cb0;
            --accent: #dd6b20;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-sub: #718096;
            --border-color: #e2e8f0;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.8; margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main); }
        /* PCでの読みやすさを考慮し max-width を 960px に調整 */
        .container { max-width: 960px; margin: 40px auto; background: var(--card-bg); padding: 50px 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        
        .back-link { display: inline-flex; align-items: center; margin-bottom: 25px; color: var(--secondary); text-decoration: none; font-weight: bold; font-size: 1em; }
        .back-link:hover { text-decoration: underline; }
        
        h1 { font-size: 1.8em; color: var(--primary); border-bottom: 3px solid var(--secondary); padding-bottom: 15px; margin-top: 0; line-height: 1.4; }
        h2 { font-size: 1.35em; color: var(--primary); border-left: 6px solid var(--secondary); padding-left: 14px; margin-top: 40px; background: #f8fafc; padding-top: 8px; padding-bottom: 8px; border-radius: 0 8px 8px 0; }
        
        .pain-points { background-color: #fffaf0; border: 1px solid #feebc8; border-radius: 10px; padding: 25px 30px; margin: 30px 0; }
        .pain-points-title { font-weight: bold; color: var(--accent); font-size: 1.15em; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .pain-points ul { margin: 0; padding-left: 22px; }
        .pain-points li { margin-bottom: 8px; color: #744210; font-weight: 500; font-size: 1.02em; }

        .meta-box { background: #ebf8ff; padding: 20px 25px; border-radius: 10px; margin: 25px 0; border: 1px solid #bee3f8; }
        .meta-box p { margin: 8px 0; font-size: 1em; }
        
        .btn { display: block; width: 80%; max-width: 450px; margin: 40px auto 10px; background: var(--secondary); color: #fff; padding: 16px 24px; border-radius: 8px; text-decoration: none; font-weight: bold; text-align: center; font-size: 1.1em; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: background 0.2s, transform 0.2s; }
        .btn:hover { background: var(--primary); transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← 補助金一覧に戻る</a>
        <h1>${title}</h1>

        <section class="pain-points">
            <div class="pain-points-title">💡 こんなお悩みありませんか？</div>
            <ul>
                ${pain_points_html}
            </ul>
        </section>

        ${ad_code}

        <section id="overview">
            <h2>1. 補助金の基本概要</h2>
            <div class="meta-box">
                ${inst_html}
                <p><strong>対象地域:</strong> ${target_area}</p>
                <p><strong>受付終了日:</strong> ${end_date}</p>
                <p><strong>補助上限額:</strong> ${amount_text}</p>
                <p><strong>補助率:</strong> ${rate_text}</p>
            </div>
        </section>

        ${ad_code}

        <section id="ai-guide">
            <h2>2. 詳細解説・活用ポイント</h2>
            ${ai_article}
            <p style="text-align: center;">
                <a href="https://www.jgrants-portal.go.jp/subsidy/${subsidy_id}" target="_blank" rel="noopener" class="btn">jGrants 公式サイトで申請要領を確認する ➔</a>
            </p>
        </section>

        ${ad_code}
    </div>
</body>
</html>
